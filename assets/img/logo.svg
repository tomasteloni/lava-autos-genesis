<svg viewBox="0 0 520 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lava Autos Génesis">
  <title>Lava Autos Génesis</title>

  <!-- ── Contorno del badge (sigue el perfil de las alas) ── -->
  <path
    d="M 60 6
       L 460 6
       C 474 6 486 14 490 30
       L 498 58
       C 500 68 494 76 484 80
       L 420 105
       L 390 120
       L 390 192
       L 130 192
       L 130 120
       L 100 105
       L 36 80
       C 26 76 20 68 22 58
       L 30 30
       C 34 14 46 6 60 6 Z"
    fill="white" stroke="#111" stroke-width="8" stroke-linejoin="round"
  />

  <!-- ── Ala izquierda (forma rellena) ── -->
  <path
    d="M 250 112
       C 218 106 178 95 130 87
       L 25 84
       L 30 97
       C 100 95 178 107 250 122 Z"
    fill="#131313"
  />

  <!-- Secciones de plumas — ala izquierda (triángulos superpuestos) -->
  <path d="M 250 117 L 205 84 L 188 88 Z" fill="#1e1e1e"/>
  <path d="M 250 117 L 168 81 L 152 86 Z" fill="#1a1a1a"/>
  <path d="M 250 117 L 132 80 L 118 85 Z" fill="#1e1e1e"/>
  <path d="M 250 117 L 98 82 L 85 87 Z"  fill="#1a1a1a"/>
  <path d="M 250 117 L 65 84 L 55 89 Z"  fill="#1e1e1e"/>
  <path d="M 250 117 L 40 86 L 32 91 Z"  fill="#1a1a1a"/>

  <!-- Líneas de separación de plumas — ala izquierda -->
  <g stroke="#3a3a3a" stroke-width="1.5" stroke-linecap="round">
    <line x1="250" y1="112" x2="205" y2="84"/>
    <line x1="250" y1="112" x2="170" y2="81"/>
    <line x1="250" y1="112" x2="134" y2="80"/>
    <line x1="250" y1="112" x2="99"  y2="82"/>
    <line x1="250" y1="112" x2="66"  y2="84"/>
    <line x1="250" y1="112" x2="38"  y2="87"/>
  </g>

  <!-- ── Ala derecha (forma rellena) ── -->
  <path
    d="M 270 112
       C 302 106 342 95 390 87
       L 495 84
       L 490 97
       C 420 95 342 107 270 122 Z"
    fill="#131313"
  />

  <!-- Secciones de plumas — ala derecha -->
  <path d="M 270 117 L 315 84 L 332 88 Z" fill="#1e1e1e"/>
  <path d="M 270 117 L 352 81 L 368 86 Z" fill="#1a1a1a"/>
  <path d="M 270 117 L 388 80 L 402 85 Z" fill="#1e1e1e"/>
  <path d="M 270 117 L 422 82 L 435 87 Z" fill="#1a1a1a"/>
  <path d="M 270 117 L 455 84 L 465 89 Z" fill="#1e1e1e"/>
  <path d="M 270 117 L 480 86 L 488 91 Z" fill="#1a1a1a"/>

  <!-- Líneas de separación — ala derecha -->
  <g stroke="#3a3a3a" stroke-width="1.5" stroke-linecap="round">
    <line x1="270" y1="112" x2="315" y2="84"/>
    <line x1="270" y1="112" x2="350" y2="81"/>
    <line x1="270" y1="112" x2="386" y2="80"/>
    <line x1="270" y1="112" x2="421" y2="82"/>
    <line x1="270" y1="112" x2="454" y2="84"/>
    <line x1="270" y1="112" x2="482" y2="87"/>
  </g>

  <!-- ── Cuerpo del águila ── -->
  <ellipse cx="260" cy="114" rx="22" ry="14" fill="#131313"/>

  <!-- ── Cabeza (mirando a la derecha) ── -->
  <circle cx="278" cy="100" r="14" fill="#131313"/>

  <!-- Pico -->
  <path d="M 289 103 L 306 106 L 289 109 Z" fill="#131313"/>

  <!-- Ojo -->
  <circle cx="283" cy="98" r="3.8" fill="white"/>
  <circle cx="284" cy="98" r="2" fill="#131313"/>

  <!-- Cuello -->
  <path d="M 268 104 C 275 96 285 95 290 103 L 285 116 C 276 121 265 118 260 112 Z" fill="#131313"/>

  <!-- Garras -->
  <path d="M 252 128 C 245 133 242 139 244 141 L 250 136 Z" fill="#131313"/>
  <path d="M 261 130 C 260 135 259 141 260 143 L 264 138 Z" fill="#131313"/>
  <path d="M 270 128 C 277 133 280 139 278 141 L 272 136 Z" fill="#131313"/>

  <!-- ── 5 estrellas azules — 2 arriba / 3 abajo (arco) ── -->
  <g fill="#1828CC" font-family="Arial Unicode MS, Arial, sans-serif" font-size="14">
    <!-- fila superior (2) -->
    <text x="240" y="90">★</text>
    <text x="257" y="90">★</text>
    <!-- fila inferior (3) -->
    <text x="225" y="103">★</text>
    <text x="242" y="103">★</text>
    <text x="259" y="103">★</text>
  </g>

  <!-- ── LAVA AUTOS — negro / blanco / azul ── -->
  <text x="260" y="56"
    font-family="Impact, 'Arial Black', Arial, sans-serif"
    font-size="54" text-anchor="middle"
    fill="none" stroke="#0a0a0a" stroke-width="13" stroke-linejoin="round">
    LAVA AUTOS
  </text>
  <text x="260" y="56"
    font-family="Impact, 'Arial Black', Arial, sans-serif"
    font-size="54" text-anchor="middle"
    fill="none" stroke="white" stroke-width="7" stroke-linejoin="round">
    LAVA AUTOS
  </text>
  <text x="260" y="56"
    font-family="Impact, 'Arial Black', Arial, sans-serif"
    font-size="54" text-anchor="middle"
    fill="#1a2cc0">
    LAVA AUTOS
  </text>

  <!-- ── GÉNESIS — blanco contorno / negro relleno ── -->
  <text x="260" y="178"
    font-family="Impact, 'Arial Black', Arial, sans-serif"
    font-size="50" text-anchor="middle"
    fill="none" stroke="white" stroke-width="10" stroke-linejoin="round">
    GÉNESIS
  </text>
  <text x="260" y="178"
    font-family="Impact, 'Arial Black', Arial, sans-serif"
    font-size="50" text-anchor="middle"
    fill="#0d0d0d">
    GÉNESIS
  </text>

</svg>
